---
name: CodeQL

on:
  push:
    branches-ignore:
      - 'l10n_*'
      - 'renovate/*'
  pull_request:
    branches-ignore:
      - 'l10n_*'
      - 'renovate/*'
  schedule:
    - cron: '30 1 * * 0'

jobs:
  codeql:
    name: 🏭 Scanning
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: 🏗 Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
      - name: 🚀 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
